<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />

  <!-- Inner Glass Accent Ring -->
  <rect x="3" y="3" width="58" height="58" rx="13" stroke="white" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Outer Clock Face -->
  <circle cx="32" cy="32" r="19" stroke="url(#icon-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Clock Hands (Displaying 8:00 PM / Duty Time) -->
  <path d="M32 32 L32 20" stroke="url(#icon-grad)" stroke-width="3.5" stroke-linecap="round" />
  <path d="M32 32 L22 32" stroke="url(#icon-grad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Center Pivot Dot -->
  <circle cx="32" cy="32" r="2.5" fill="#ffffff" />

  <!-- Checkmark Badge Accent -->
  <circle cx="44" cy="44" r="8" fill="#10b981" stroke="#ffffff" stroke-width="2" />
  <path d="M40.5 44 L43 46.5 L47.5 41.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>